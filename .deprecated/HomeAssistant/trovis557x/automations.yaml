    - action: input_number.set_value
      target:
        entity_id: input_number.trovis_hk2_vl_max
      data:
        value: "{{ states('sensor.trovis_hk2_vl_max') | int(0) }}"

    ##################################### Rk3 ##################################

    # - action: input_number.set_value
